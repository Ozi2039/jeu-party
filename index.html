<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.json">
<title>Vérité Party</title>
<style>
  html, body {
    margin:0;
    padding:0;
    height:100%;
    width:100%;
    font-family:sans-serif;
    background:#0d1117;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    -webkit-user-select: none;
    user-select: none;
  }
  .phone {
    width: 320px;
    height: 600px;
    border-radius: 36px;
    background: url('Zu1MKPS9.jpg') no-repeat center/cover;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
    box-shadow: 0 0 40px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
    transition: none;
  }
  .phone::before {
    content: "";
    position: absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.5);
    z-index: 0;
    border-radius: 36px;
  }
  .phone > * { position: relative; z-index: 1; }
  .fullscreen {
    width: 100vw !important;
    height: calc(var(--vh, 1vh) * 100) !important;
    border-radius: 0 !important;
    box-shadow: none !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  .screen {display:none; width:100%; flex-direction:column; align-items:center; justify-content:center;}
  .active {display:flex;}
  button {
    padding:10px 15px;
    margin:5px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    background:#00d4ff;
    font-weight:bold;
    font-size:14px;
    color:#000;
    flex: 1;
  }
  button.small { flex: 0 0 auto; padding:8px 12px; }
  .button-row { display: flex; justify-content: center; width: 100%; max-width: 280px; }
  input, textarea {
    padding:8px;
    margin:5px;
    border-radius:6px;
    border:none;
    width:100%;
    background: rgba(255,255,255,0.8);
    color: #000;
  }
  .players-list { margin:3px 0; max-height: 100px; overflow-y: auto; width: 100%; max-width: 280px; }
  .call-box {text-align:center; width: 100%;}
  .caller {font-size:20px; margin-bottom:20px;}
  .slide-container { position: relative; width: calc(100% - 20px); height: 60px; background: rgba(0,0,0,0.6); border-radius: 30px; overflow: hidden; margin: 0 10px; }
  .slide-btn { position: absolute; top:5px; left:5px; width:50px; height:50px; background:#00ff88; border-radius:50%; cursor:grab; display:flex; align-items:center; justify-content:center; font-weight:bold; user-select: none; touch-action: none; }
  .question { font-size:20px; max-width:280px; padding:20px; background: rgba(0,0,0,0.7); border-radius:12px; margin:20px; text-align:center; }
  .question-prompt { font-size:16px; color:#ccc; margin-bottom:10px; text-align:center; }
  .slide-text {text-align:center; margin-top:10px; font-size:14px; color:#ccc;}
  .ask-jackson-screen { text-align:center; width:100%; max-width:280px; display: flex; flex-direction: column; justify-content: center; min-height: 100%; padding: 20px; box-sizing: border-box; }
  .ask-jackson-screen textarea { min-height:100px; resize:vertical; margin-bottom: 10px; }
  @media (max-width: 480px) {
    .phone { width: 100vw; height: calc(var(--vh, 1vh) * 100); border-radius:0; box-shadow: none; }
    .phone::before { border-radius:0; }
    .question { max-width: calc(100% - 40px); }
    .slide-container { width: calc(100% - 20px); margin: 0 10px; }
    .ask-jackson-screen { padding-bottom: 150px; }
  }

  /* BANNIERE SUGGESTION INSTALL PLAY-STORE (ANDROID) */
  #androidInstallBanner {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: 18px;
    background: rgba(0,0,0,0.85);
    color: #fff;
    border-radius: 12px;
    padding: 12px;
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 9999;
    box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    font-family: sans-serif;
  }
  #androidInstallBanner .text { flex: 1; font-size: 14px; }
  #androidInstallBanner button {
    background: #00d4ff;
    color: #000;
    border: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-weight: 700;
    cursor: pointer;
  }
  #androidInstallBanner .close {
    background: transparent;
    color: #fff;
    border: none;
    font-size: 16px;
    cursor: pointer;
    padding: 4px;
  }
</style>
</head>
<body>
<div class="phone" id="phone">
  <audio id="ringtone" loop preload="auto" playsinline></audio>
  <div id="menu" class="screen active">
    <h1>Le jeu de Toutle🌎</h1>
    <h3>Liste des joueurs</h3>
    <div id="playersList" class="players-list"></div>
    <input type="text" id="playerInput" placeholder="Nom du joueur">
    <button onclick="addPlayer()">Ajouter joueur</button>
    <h3>Importer Questions par défaut (JSON)</h3>
    <input type="file" id="questionsFile" accept=".json">
    <textarea id="questionsInput" rows="5" cols="30" readonly></textarea><br>
    <br><br>
    <div class="button-row">
      <button id="playBtn">🎮 Jouer</button>
      <button onclick="confirmEndGame()">🏁 Terminer</button>
    </div>
    <div class="button-row">
      <button onclick="resetUsedQuestions()">🔁 Réinitialiser questions</button>
      <button onclick="downloadDefaultQuestions()">⬇️ Télécharger questions</button>
    </div>
    <div class="button-row">
      <button onclick="toggleFullScreen()" id="fullscreenBtn" class="small">📱 Plein écran</button>
    </div>
  </div>
  <div id="callScreen" class="screen">
    <div class="call-box">
      <div class="caller" id="callerName"></div>
      <div class="slide-container" id="slider">
        <div class="slide-btn" id="slideBtn">📞</div>
      </div>
      <div class="slide-text">→ Glisse pour décrocher</div>
    </div>
  </div>
  <div id="questionScreen" class="screen">
    <div class="question-prompt" id="questionPrompt"></div>
    <div class="question" id="questionText"></div>
    <div class="button-row">
      <button onclick="answerQuestion()">✅ Répondre</button>
      <button onclick="takeShot()">🥃 Shot</button>
    </div>
    <div class="button-row">
      <button onclick="backToMenu()">🏠 Menu</button>
      <button onclick="confirmEndGame()">🏁 Terminer</button>
    </div>
  </div>
  <div id="askJacksonScreen" class="screen">
    <div class="ask-jackson-screen">
      <h2 id="askHeader">Pose une question à Jackson</h2>
      <textarea id="newQuestionInput" placeholder="Ta question..."></textarea>
      <div class="button-row">
        <button onclick="submitNewQuestion()">📤 Envoyer</button>
        <button onclick="skipNewQuestion()">➡️ Passer</button>
      </div>
    </div>
  </div>
  <div id="statsScreen" class="screen">
    <h2>📊 Stats de la partie</h2>
    <div id="statsList"></div>
    <div class="button-row">
      <button onclick="endGameToMenu()">🏠 Retour au Menu</button>
      <button onclick="downloadDefaultQuestions()">⬇️ Télécharger Questions par défaut</button>
    </div>
  </div>
</div>

<!-- Bannière Android personnalisée (propose Play Store) -->
<div id="androidInstallBanner" role="dialog" aria-live="polite">
  <div class="text">
    Pour une meilleure expérience, installez l'application native.
  </div>
  <button id="androidInstallBtn">Télécharger l'app</button>
  <button class="close" id="androidInstallClose" aria-label="Fermer">✕</button>
</div>

<script>
/* ---------------- PWA: service worker registration + beforeinstallprompt handling ---------------- */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js')
    .then(reg => console.log('SW enregistré', reg))
    .catch(err => console.warn('SW registration failed', err));
}

(function(){
  const PLAY_STORE_URL = 'https://play.google.com/store/apps/details?id=com.example.app'; // <-- remplace par ton URL
  const banner = document.getElementById('androidInstallBanner');
  const installBtn = document.getElementById('androidInstallBtn');
  const closeBtn = document.getElementById('androidInstallClose');

  function isAndroidBrowser() {
    const ua = navigator.userAgent || '';
    return /Android/i.test(ua) && !/Windows Phone/i.test(ua);
  }
  function isStandalone() {
    return window.matchMedia && window.matchMedia('(display-mode: standalone)').matches
      || window.navigator.standalone === true;
  }
  function showBanner() {
    if (!isAndroidBrowser()) return;
    if (isStandalone()) return;
    // don't show if user dismissed previously
    if (localStorage.getItem('vp_android_banner_dismissed') === '1') return;
    banner.style.display = 'flex';
  }
  function hideBanner() {
    banner.style.display = 'none';
    try { localStorage.setItem('vp_android_banner_dismissed', '1'); } catch(e){ }
  }

  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    showBanner();
  });

  window.addEventListener('load', () => {
    setTimeout(() => {
      if (!deferredPrompt && !isStandalone() && isAndroidBrowser()) {
        // show suggestion if PWA not detected but on Android
        showBanner();
      }
    }, 900);
  });

  installBtn.addEventListener('click', async () => {
    // si beforeinstallprompt dispo on peut déclencher le prompt natif
    if (deferredPrompt) {
      try {
        deferredPrompt.prompt();
        const choice = await deferredPrompt.userChoice;
        deferredPrompt = null;
        hideBanner();
        return;
      } catch(e) {
        // fallback to Play Store redirect
      }
    }
    try { window.location.href = PLAY_STORE_URL; }
    catch(e) { window.open(PLAY_STORE_URL, '_blank'); }
    hideBanner();
  });

  closeBtn.addEventListener('click', hideBanner);

  window.matchMedia('(display-mode: standalone)').addEventListener('change', e => {
    if (e.matches) hideBanner();
  });
})();

/* ---------------- Reste du script original (inchangé, mais formaté) ---------------- */

let players = [];
let questions = [];
let usedQuestions = [];
let stats = {};
let currentPlayer = "";
let lastPlayer = "";
let lastQuestion = "";
let selectedPlayers = [];
let selectedQuestions = [];
const LOCAL_KEY_DEFAULT = 'vp_defaultQuestions_v1';
const LOCAL_KEY_USED = 'vp_usedQuestions_v1';
const ringtone = document.getElementById('ringtone');
let audioUnlocked = false;
let audioCtx = null;
let vibrationInterval = null;
const ringtoneImageMap = [
  { name: 'Jackson', audio: 'audio1.mp3', image: 'image1.jpg' },
  { name: 'Eddy Malou', audio: 'audio2.mp3', image: 'image2.jpg' },
  { name: 'Ok Garmin', audio: 'audio3.mp3', image: 'image3.jpg' },
  { name: 'Docteur sensuel Douglasss', audio: 'audio4.mp3', image: 'image4.jpg' },
  { name: 'Carlos Sainz Jr', audio: 'audio5.mp3', image: 'image5.jpg' },
  { name: 'Charles Tisseyre', audio: 'audio6.mp3', image: 'image6.jpg' },
  { name: 'Aquaman', audio: 'audio7.mp3', image: 'image7.jpg' },
  { name: 'Buzzman', audio: 'audio8.mp3', image: 'image8.jpg' },
  { name: 'Eggman', audio: 'audio9.mp3', image: 'image9.jpg' },
  { name: 'ton chauffeur Uber', audio: 'audio10.mp3', image: 'image10.jpg' },
  { name: 'Adams le castor', audio: 'audio11.mp3', image: 'image11.jpg' },
  { name: 'Annie', audio: 'audio12.mp3', image: 'image12.jpg' }
];
let currentCallerEntry = null;
let currentCallerName = '';
window.addEventListener('load', () => {
  tryUnlockAudio();
  loadDefaultQuestions();
});
document.addEventListener('pointerdown', function unlockOnce(){
  tryUnlockAudio().finally(() => {
    document.removeEventListener('pointerdown', unlockOnce);
  });
});
async function tryUnlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') {
      await audioCtx.resume();
    }
    try {
      const buff = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buff;
      src.connect(audioCtx.destination);
      src.start(0);
    } catch (silentErr) {
      console.warn('Silent buffer workaround failed:', silentErr);
    }
    chooseCallerEntry();
    await ringtone.play().catch(()=>{});
    ringtone.pause();
    ringtone.currentTime = 0;
    audioUnlocked = true;
    console.log('Audio débloqué automatiquement');
    document.getElementById('phone').style.backgroundImage = `url('Zu1MKPS9.jpg')`;
    return true;
  } catch (err) {
    console.warn('tryUnlockAudio: tentative échouée', err);
    try {
      chooseCallerEntry();
      const a = new Audio(currentCallerEntry.audio);
      document.getElementById('phone').style.backgroundImage = `url('${currentCallerEntry.image}')`;
      a.playsInline = true;
      a.loop = true;
      await a.play();
      a.pause();
      audioUnlocked = true;
      console.log('Audio débloqué via fallback Audio()');
      document.getElementById('phone').style.backgroundImage = `url('Zu1MKPS9.jpg')`;
      return true;
    } catch (err2) {
      console.error('tryUnlockAudio: fallback échoué', err2);
      return false;
    }
  }
}
function startVibrationLoop() {
  if ('vibrate' in navigator) {
    vibrationInterval = setInterval(() => {
      navigator.vibrate([1000, 100]);
    }, 1100);
    navigator.vibrate([1000, 100]);
  }
}
function stopVibrationLoop() {
  if (vibrationInterval) {
    clearInterval(vibrationInterval);
    vibrationInterval = null;
  }
  if ('vibrate' in navigator) {
    navigator.vibrate(0);
  }
}
function chooseCallerEntry(){
  const entry = ringtoneImageMap[Math.floor(Math.random() * ringtoneImageMap.length)];
  currentCallerEntry = entry;
  currentCallerName = entry.name;
  ringtone.src = entry.audio;
  document.getElementById('phone').style.backgroundImage = `url('${entry.image}')`;
}
function playRingtone() {
  if (!ringtone) return;
  if (!currentCallerEntry) chooseCallerEntry();
  document.getElementById('phone').style.backgroundImage = `url('${currentCallerEntry.image}')`;
  ringtone.loop = true;
  ringtone.play().then(() => {
    audioUnlocked = true;
    startVibrationLoop();
  }).catch(err => {
    console.warn('playRingtone failed:', err);
  });
}
function stopRingtone() {
  if (!ringtone) return;
  try {
    ringtone.pause();
    ringtone.currentTime = 0;
    stopVibrationLoop();
  } catch (e) {
    console.warn('Erreur en stoppant la sonnerie', e);
  }
}
function saveDefaultQuestions() {
  try {
    localStorage.setItem(LOCAL_KEY_DEFAULT, JSON.stringify(questions));
  } catch (e) { console.warn('saveDefaultQuestions failed', e); }
}
function saveUsedQuestions() {
  try {
    localStorage.setItem(LOCAL_KEY_USED, JSON.stringify(usedQuestions));
  } catch (e) { console.warn('saveUsedQuestions failed', e); }
}
async function loadDefaultQuestions() {
  try {
    const stored = localStorage.getItem(LOCAL_KEY_DEFAULT);
    if (stored) {
      try {
        const parsedStored = JSON.parse(stored);
        if (Array.isArray(parsedStored) && parsedStored.length > 0) {
          questions = parsedStored.slice();
        } else {
          const resp = await fetch('questions.json').catch(() => null);
          if (resp && resp.ok) {
            const data = await resp.json();
            questions = Array.isArray(data) ? data : [];
            saveDefaultQuestions();
          } else {
            questions = [];
          }
        }
      } catch (e) {
        const resp = await fetch('questions.json').catch(() => null);
        if (resp && resp.ok) {
          const data = await resp.json();
          questions = Array.isArray(data) ? data : [];
          saveDefaultQuestions();
        } else {
          questions = [];
        }
      }
    } else {
      try {
        const resp = await fetch('questions.json');
        if (resp.ok) {
          const data = await resp.json();
          questions = Array.isArray(data) ? data : [];
          saveDefaultQuestions();
        } else {
          questions = [];
        }
      } catch (e) {
        questions = [];
      }
    }
  } catch (e) {
    console.warn('loadDefaultQuestions parse failed', e);
    questions = [];
  }
  try {
    const used = localStorage.getItem(LOCAL_KEY_USED);
    usedQuestions = used ? JSON.parse(used) : [];
    usedQuestions = Array.isArray(usedQuestions) ? usedQuestions : [];
    usedQuestions = usedQuestions.filter(q => questions.includes(q));
    saveUsedQuestions();
  } catch (e) { usedQuestions = []; }
  document.getElementById("questionsInput").value = JSON.stringify(questions, null, 2);
}
function resetUsedQuestions(){
  if (!confirm('Réinitialiser la liste des questions déjà utilisées ?')) return;
  usedQuestions = [];
  saveUsedQuestions();
  alert('Liste des questions utilisées réinitialisée.');
}
function addPlayer(){
  const name = document.getElementById("playerInput").value.trim();
  if(name){
    players.push(name);
    stats[name] = {received: 0, answered: 0, shotsTaken: 0};
    document.getElementById("playerInput").value = "";
    renderPlayers();
  }
}
function renderPlayers(){
  const list = document.getElementById("playersList");
  list.innerHTML = players.map((p,i)=>`<div>${p} <button onclick="removePlayer(${i})">❌</button></div>`).join("");
}
function removePlayer(i){
  delete stats[players[i]];
  if (players[i] === lastPlayer) lastPlayer = "";
  selectedPlayers = selectedPlayers.filter(p => p !== players[i]);
  players.splice(i,1);
  renderPlayers();
}
function handleFileUpload(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const parsed = JSON.parse(e.target.result);
        if (!Array.isArray(parsed)) throw new Error('Le JSON doit être un tableau de chaînes.');
        questions = parsed.slice();
        usedQuestions = [];
        saveDefaultQuestions();
        saveUsedQuestions();
        document.getElementById("questionsInput").value = JSON.stringify(questions, null, 2);
        alert("Questions par défaut importées avec succès. Les questions utilisées ont été réinitialisées.");
      } catch (e) {
        alert("Erreur : Fichier JSON invalide ou format incorrect. Il doit contenir un tableau.");
      }
    };
    reader.readAsText(file);
  } else {
    alert("Veuillez sélectionner un fichier JSON valide !");
  }
}
document.getElementById("questionsFile").addEventListener("change", handleFileUpload);
const menu = document.getElementById("menu");
const callScreen = document.getElementById("callScreen");
const questionScreen = document.getElementById("questionScreen");
const askJacksonScreen = document.getElementById("askJacksonScreen");
const statsScreen = document.getElementById("statsScreen");
const callerName = document.getElementById("callerName");
const questionText = document.getElementById("questionText");
const questionPrompt = document.getElementById("questionPrompt");
const phone = document.getElementById("phone");
document.getElementById("playBtn").addEventListener("click", startGame);
function toggleFullScreen() {
  if (!document.fullscreenElement) {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(err => console.error('Fullscreen error:', err));
    } else if (docEl.webkitRequestFullscreen) {
      docEl.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT).catch(err => console.error('Fullscreen error:', err));
    }
    phone.classList.add('fullscreen');
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(err => console.error('Exit fullscreen error:', err));
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
    phone.classList.remove('fullscreen');
  }
}
function startGame(){
  if(players.length===0){ alert("Ajoute au moins un joueur !"); return; }
  if(questions.length===0){ alert("Veuillez importer ou fournir un fichier de questions JSON par défaut !"); return; }
  players.forEach(p => stats[p] = stats[p] || {received: 0, answered: 0, shotsTaken: 0});
  let availablePlayers = players.filter(p => !selectedPlayers.includes(p));
  if (availablePlayers.length === 0) {
    availablePlayers = players;
    selectedPlayers = [];
  }
  const player = availablePlayers[Math.floor(Math.random() * availablePlayers.length)];
  selectedPlayers.push(player);
  let availableQuestions = questions.filter(q => !usedQuestions.includes(q) && q !== lastQuestion);
  if (availableQuestions.length === 0) {
    usedQuestions = [];
    saveUsedQuestions();
    availableQuestions = questions.filter(q => q !== lastQuestion);
  }
  if (availableQuestions.length === 0) availableQuestions = questions;
  const question = availableQuestions[Math.floor(Math.random() * availableQuestions.length)];
  selectedQuestions.push(question);
  if (!usedQuestions.includes(question)) {
    usedQuestions.push(question);
    saveUsedQuestions();
  }
  currentPlayer = player;
  lastPlayer = player;
  lastQuestion = question;
  stats[player].received++;
  chooseCallerEntry();
  callerName.textContent = `Yo ${player}, ${currentCallerName} t'appelle !`;
  questionPrompt.textContent = "Répond à la question ou prend un shot :";
  questionText.textContent = question;
  menu.classList.remove("active");
  callScreen.classList.add("active");
  document.querySelectorAll('#menu input, #menu textarea, #menu button').forEach(el => el.style.display='none');
  document.querySelectorAll('#menu .button-row').forEach(el => el.style.display='flex');
  initSlider();
  playRingtone();
}
function answerQuestion(){
  stats[currentPlayer].answered++;
  stopRingtone();
  showAskJacksonScreen();
}
function takeShot(){
  stats[currentPlayer].shotsTaken++;
  stopRingtone();
  showAskJacksonScreen();
}
function showAskJacksonScreen(){
  questionScreen.classList.remove("active");
  askJacksonScreen.classList.add("active");
  document.getElementById("newQuestionInput").value = "";
  const askHeader = document.getElementById('askHeader');
  askHeader.textContent = `Pose une question à ${currentCallerName}`;
}
function submitNewQuestion(){
  const newQuestion = document.getElementById("newQuestionInput").value.trim();
  if(newQuestion){
    if (!questions.includes(newQuestion)) {
      questions.push(newQuestion);
      saveDefaultQuestions();
      document.getElementById("questionsInput").value = JSON.stringify(questions, null, 2);
    }
  }
  continueGame();
}
function skipNewQuestion(){
  continueGame();
}
function continueGame(){
  callScreen.classList.remove("active");
  questionScreen.classList.remove("active");
  askJacksonScreen.classList.remove("active");
  stopRingtone();
  startGame();
}
function backToMenu(){
  stopRingtone();
  questionScreen.classList.remove("active");
  callScreen.classList.remove("active");
  askJacksonScreen.classList.remove("active");
  menu.classList.add("active");
  document.querySelectorAll('#menu input, #menu textarea, #menu button').forEach(el => el.style.display='block');
  document.querySelectorAll('#menu .button-row').forEach(el => el.style.display='flex');
  document.getElementById('phone').style.backgroundImage = `url('Zu1MKPS9.jpg')`;
}
function confirmEndGame(){
  if (confirm("Voulez-vous vraiment terminer la partie ?")) {
    if (questionScreen.classList.contains("active") && currentPlayer && stats[currentPlayer].received > 0) {
      stats[currentPlayer].received--;
    }
    stopRingtone();
    questionScreen.classList.remove("active");
    callScreen.classList.remove("active");
    askJacksonScreen.classList.remove("active");
    statsScreen.classList.add("active");
    renderStats();
  }
}
function endGameToMenu(){
  statsScreen.classList.remove("active");
  menu.classList.add("active");
  document.querySelectorAll('#menu input, #menu textarea, #menu button').forEach(el => el.style.display='block');
  document.querySelectorAll('#menu .button-row').forEach(el => el.style.display='flex');
  document.getElementById('phone').style.backgroundImage = `url('Zu1MKPS9.jpg')`;
}
function renderStats(){
  const list = document.getElementById("statsList");
  list.innerHTML = players.map(p => {
    const s = stats[p];
    const ratio = s.received > 0 ? Math.round((s.answered / s.received) * 100) : 0;
    return `<div>👤 ${p}: ✅ Réponses: ${s.answered}, 🥃 Shots: ${s.shotsTaken}, 📈 Ratio: ${ratio}%</div>`;
  }).join("");
}
function downloadDefaultQuestions(){
  const data = JSON.stringify(questions, null, 2);
  const blob = new Blob([data], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'questions-default.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function initSlider(){
  const btn = document.getElementById("slideBtn");
  const slider = document.getElementById("slider");
  let isDragging=false, startX=0;
  btn.style.left="5px";
  const maxSlideDistance = slider.offsetWidth - btn.offsetWidth - 10;
  btn.onmousedown=e=>{ isDragging=true; startX=e.clientX; };
  document.onmouseup=e=>{
    if(isDragging){
      isDragging=false;
      if(parseInt(btn.style.left) > maxSlideDistance * 0.9){
        stopRingtone();
        callScreen.classList.remove("active");
        questionScreen.classList.add("active");
      } else {
        btn.style.left="5px";
      }
    }
  };
  document.onmousemove=e=>{
    if(isDragging){
      let dx=e.clientX-startX;
      btn.style.left=Math.min(Math.max(5,5+dx),maxSlideDistance)+"px";
    }
  };
  btn.ontouchstart=e=>{
    isDragging=true;
    startX=e.touches[0].clientX;
    e.preventDefault();
  };
  btn.ontouchend=e=>{
    if(isDragging){
      isDragging=false;
      if(parseInt(btn.style.left) > maxSlideDistance * 0.9){
        stopRingtone();
        callScreen.classList.remove("active");
        questionScreen.classList.add("active");
      } else {
        btn.style.left="5px";
      }
    }
  };
  btn.ontouchmove=e=>{
    if(isDragging){
      let dx=e.touches[0].clientX-startX;
      btn.style.left=Math.min(Math.max(5,5+dx),maxSlideDistance)+"px";
      e.preventDefault();
    }
  };
}
function setVh() {
  let vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
}
window.addEventListener('resize', setVh);
window.addEventListener('load', setVh);
function isAppleDevice() {
  return /iPhone|iPad|iPod|Macintosh/.test(navigator.userAgent);
}
window.addEventListener("load", () => {
  if (isAppleDevice()) {
    alert("⚠️ Sur iPhone/iPad, le mode plein écran doit être activé manuellement. Si la sonnerie ne se lance pas, tapez n'importe où sur l'écran.");
  }
});
// Ensure textarea is visible when keyboard appears
document.getElementById("newQuestionInput").addEventListener("focus", function() {
  setTimeout(() => {
    this.scrollIntoView({ behavior: "smooth", block: "center" });
    // fallback if querySelector fails above
    try { document.querySelector('.ask-jackson-screen').style.paddingBottom = '200px'; } catch(e){}
  }, 300);
});
document.getElementById("newQuestionInput").addEventListener("blur", function() {
  const askJacksonScreen = document.querySelector('.ask-jackson-screen');
  askJacksonScreen.style.paddingBottom = '20px';
});
</script>
